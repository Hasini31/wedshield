# =============================================================================
# WebShield - Spring Boot Application Configuration
# =============================================================================

spring.application.name=webshield
spring.main.web-application-type=none
spring.main.banner-mode=off

# -----------------------------------------------------------------------------
# Database Configuration (MySQL 8.0 via Docker)
# Environment variables override default local settings:
# DB_URL, DB_USER, DB_PASSWORD
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/webshield?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:webshield_user}
spring.datasource.password=${DB_PASSWORD:webshield_pass_2024}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.pool-name=WebShieldHikariPool

# -----------------------------------------------------------------------------
# JPA & Hibernate Settings
# Non-destructive: validation mode preserves existing database tables
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Explicit MySQLDialect enables offline startup and headless testing without live database connection
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------------------------------------------
# Logging Configuration
# -----------------------------------------------------------------------------
logging.level.root=WARN
logging.level.com.webshield=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

